
<h2 class="sr-only">HTML-Datei-Generator: HTML-Code einfügen und als Datei herunterladen</h2>
<div style="padding: 1.25rem 0 0;">
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;">
    <i class="ti ti-code" style="font-size: 22px; color: var(--color-text-secondary);" aria-hidden="true"></i>
    <div>
      <p style="font-size: 15px; font-weight: 500; margin: 0; color: var(--color-text-primary);">HTML zu Datei</p>
      <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0;">Code einfügen → Dateiname vergeben → herunterladen</p>
    </div>
  </div>

  <div style="display: flex; gap: 10px; margin-bottom: 12px; align-items: center;">
    <div style="flex: 1;">
      <label for="filename" style="font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 4px;">Dateiname</label>
      <div style="display: flex; align-items: center; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); overflow: hidden;">
        <i class="ti ti-file" style="font-size: 15px; padding: 0 8px; color: var(--color-text-secondary);" aria-hidden="true"></i>
        <input type="text" id="filename" value="meine-seite" placeholder="dateiname" style="flex: 1; border: none; outline: none; background: transparent; padding: 8px 0; font-size: 14px; color: var(--color-text-primary);" />
        <span style="padding: 0 10px; font-size: 13px; color: var(--color-text-secondary); background: var(--color-background-secondary); height: 100%; display: flex; align-items: center; border-left: 0.5px solid var(--color-border-tertiary);">.html</span>
      </div>
    </div>
    <div style="padding-top: 18px;">
      <button id="btn-download" onclick="doDownload()" style="display: flex; align-items: center; gap: 6px; padding: 8px 18px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); cursor: pointer; font-size: 14px; color: var(--color-text-primary); white-space: nowrap;">
        <i class="ti ti-download" style="font-size: 16px;" aria-hidden="true"></i>
        Herunterladen
      </button>
    </div>
  </div>

  <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
    <label for="editor" style="font-size: 12px; color: var(--color-text-secondary);">HTML-Code</label>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span id="line-count" style="font-size: 12px; color: var(--color-text-secondary);">0 Zeilen</span>
      <button onclick="clearEditor()" style="font-size: 12px; color: var(--color-text-secondary); background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px;">
        <i class="ti ti-trash" style="font-size: 13px;" aria-hidden="true"></i>
        Leeren
      </button>
    </div>
  </div>

  <textarea id="editor"
    placeholder="HTML-Code hier einfügen…&#10;&#10;&lt;!DOCTYPE html&gt;&#10;&lt;html lang=&quot;de&quot;&gt;&#10;  &lt;head&gt;...&lt;/head&gt;&#10;  &lt;body&gt;...&lt;/body&gt;&#10;&lt;/html&gt;"
    style="width: 100%; height: 320px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; padding: 12px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); resize: vertical; color: var(--color-text-primary); outline: none; box-sizing: border-box; tab-size: 2;"
    spellcheck="false"
    oninput="updateCount(this)"
  ></textarea>

  <div id="status-bar" style="margin-top: 10px; min-height: 32px;"></div>

  <div style="margin-top: 1.5rem; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 1rem;">
    <p style="font-size: 12px; color: var(--color-text-secondary); margin: 0 0 8px; font-weight: 500;">Vorschau</p>
    <div id="preview-wrap" style="border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); overflow: hidden; min-height: 60px;">
      <iframe id="preview" style="width: 100%; height: 280px; border: none; display: block;" title="HTML-Vorschau" sandbox="allow-scripts"></iframe>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: 6px;">
      <button onclick="updatePreview()" style="font-size: 12px; color: var(--color-text-secondary); background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px;">
        <i class="ti ti-refresh" style="font-size: 13px;" aria-hidden="true"></i>
        Vorschau aktualisieren
      </button>
    </div>
  </div>
</div>

<script>
let previewTimer = null;

function updateCount(el) {
  const lines = el.value ? el.value.split('\n').length : 0;
  const chars = el.value.length;
  document.getElementById('line-count').textContent = lines + ' Zeilen · ' + chars.toLocaleString('de') + ' Zeichen';
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 800);
}

function updatePreview() {
  const code = document.getElementById('editor').value.trim();
  const frame = document.getElementById('preview');
  if (!code) {
    frame.srcdoc = '<html><body style="display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;color:#aaa;font-size:13px;">Noch kein Code eingefügt</body></html>';
    return;
  }
  frame.srcdoc = code;
}

function clearEditor() {
  document.getElementById('editor').value = '';
  document.getElementById('line-count').textContent = '0 Zeilen';
  document.getElementById('status-bar').innerHTML = '';
  updatePreview();
}

function doDownload() {
  const code = document.getElementById('editor').value.trim();
  const rawName = document.getElementById('filename').value.trim() || 'meine-seite';
  const filename = rawName.replace(/\.html$/i, '') + '.html';
  const bar = document.getElementById('status-bar');

  if (!code) {
    bar.innerHTML = '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-background-warning);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:13px;color:var(--color-text-warning);"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Bitte zuerst HTML-Code einfügen.</div>';
    return;
  }

  try {
    const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    bar.innerHTML = '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-background-success);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:13px;color:var(--color-text-success);"><i class="ti ti-circle-check" aria-hidden="true"></i> <strong>' + filename + '</strong> wurde heruntergeladen.</div>';
  } catch(e) {
    bar.innerHTML = '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-background-danger);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:13px;color:var(--color-text-danger);"><i class="ti ti-x" aria-hidden="true"></i> Fehler beim Download: ' + e.message + '</div>';
  }
}

updatePreview();
</script>
